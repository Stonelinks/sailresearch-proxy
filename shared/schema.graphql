type ActiveResearch {
  batch: BatchProgress
  modelIds: [String!]!
}

type BatchProgress {
  completed: Int!
  errors: Int!
  id: String!
  total: Int!
}

scalar DateTime

scalar JSON

type Model {
  contextSize: Int
  created: Int!
  description: String
  id: ID!
  object: String!
  ownedBy: String!
  prices: [ModelPrice!]
  reasoning: Boolean!
  researchedAt: DateTime
  samplingPresets: [SamplingPreset!]
  source: String
  supportedWindows: [String!]
  supportsImage: Boolean!
  thinkingLevelMap: JSON
}

type ModelPrice {
  cachedInputPerMTok: Float
  completionWindow: String!
  currency: String!
  inputPerMTok: Float!
  outputPerMTok: Float!
}

type ModelResearchUpdate {
  batch: BatchProgress
  error: String
  modelId: String!
  status: ResearchUpdateStatus!
}

type Mutation {
  refetchModel(modelId: ID!): Model!
  researchAllModels: [Model!]!
}

type Query {
  activeResearch: ActiveResearch!
  model(id: ID!): Model
  models: [Model!]!
}

enum ResearchUpdateStatus {
  completed
  failed
  started
}

type SamplingPreset {
  description: String!
  name: String!
  params: JSON!
}

type Subscription {
  modelResearchUpdated: ModelResearchUpdate!
}
