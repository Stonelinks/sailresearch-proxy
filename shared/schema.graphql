scalar DateTime

scalar JSON

type Job {
  apiType: String!
  completedAt: DateTime
  completionWindow: String!
  createdAt: DateTime!
  durationMs: Int
  hasError: Boolean!
  id: ID!
  model: String!
  pollCount: Int!
  sailResponseId: String!
  status: JobStatus!
}

type JobDetail {
  apiType: String!
  completedAt: DateTime
  completionWindow: String!
  createdAt: DateTime!
  durationMs: Int
  errorBody: String
  hasError: Boolean!
  id: ID!
  model: String!
  pollCount: Int!
  requestBody: String
  responseBody: String
  sailResponseId: String!
  status: JobStatus!
}

enum JobStatus {
  cancelled
  completed
  failed
  pending
  queued
  running
}

type JobsResult {
  jobs: [Job!]!
  limit: Int!
  offset: Int!
  total: Int!
}

type Model {
  contextSize: Int
  created: Int!
  description: String
  id: ID!
  object: String!
  ownedBy: String!
  researchedAt: DateTime
  samplingPresets: [SamplingPreset!]
  source: String
}

type Mutation {
  refetchModel(modelId: ID!): Model!
}

type Query {
  job(id: ID!): JobDetail
  jobs(limit: Int = 50, offset: Int = 0, status: JobStatus): JobsResult!
  models: [Model!]!
}

type SamplingPreset {
  description: String!
  name: String!
  params: JSON!
}

type Subscription {
  jobUpdated(id: ID): Job!
}
